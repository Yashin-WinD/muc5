<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - GraphQL Store'">GraphQL Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-badge"><i class="bi bi-diagram-3-fill"></i> GraphQL</span>
                <span class="fw-bold text-dark">E-Store</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activePage == 'home' ? 'active fw-bold text-primary' : ''}" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i> Trang chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activePage == 'products' ? 'active fw-bold text-primary' : ''}" th:href="@{/products}">
                            <i class="bi bi-box-seam me-1"></i> Quản lý Sản phẩm
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activePage == 'categories' ? 'active fw-bold text-primary' : ''}" th:href="@{/categories}">
                            <i class="bi bi-tags me-1"></i> Quản lý Danh mục
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/graphiql" target="_blank" class="btn btn-outline-primary btn-sm px-3 py-2 rounded-pill">
                        <i class="bi bi-terminal me-1"></i> Mở GraphiQL IDE
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer class="footer bg-white border-top py-4 mt-auto" th:fragment="footer">
        <div class="container text-center text-muted">
            <p class="mb-1">Học phần Lập trình Web - Spring Boot GraphQL & Thymeleaf AJAX</p>
            <small>Xây dựng theo bài giảng: <strong>GraphQL & RestFul API trong Spring Boot</strong> (ThS. Nguyễn Hữu Trung)</small>
        </div>
    </footer>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
        <script th:src="@{/js/graphql-client.js}"></script>
    </div>
</body>
</html>
