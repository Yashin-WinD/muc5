server.port=8088

# Spring GraphQL configuration (sử dụng custom GraphiQL controller với CDN ổn định)
spring.graphql.graphiql.enabled=false
spring.graphql.schema.locations=classpath:graphql/

# Datasource configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/graphql_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=bao123456
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.org.springframework.graphql=INFO
logging.level.com.example.graphql=INFO
